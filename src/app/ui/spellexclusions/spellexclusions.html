<!DOCTYPE html>
<html lang="vi" window-frame="transparent">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng từ điển & Loại trừ chính tả</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="../shared/subdialog.css">
    <link rel="stylesheet" href="../shared/dropdown.css">
    <link rel="stylesheet" href="spellexclusions.css">
    <script src="../shared/strings.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/utils.js"></script>
    <script src="spellexclusions.js"></script>
</head>

<body>
    <div class="container" id="main-container">
        <!-- Title Bar -->
        <div class="title-bar">
            <span class="title-text" id="dlg-title">Từ điển & Loại trừ chính tả</span>
            <button class="btn-close" id="btn-close" title="Đóng">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                    fill="rgba(240,23,23,1)">
                    <path
                        d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 10.5858L9.17157 7.75736L7.75736 9.17157L10.5858 12L7.75736 14.8284L9.17157 16.2426L12 13.4142L14.8284 16.2426L16.2426 14.8284L13.4142 12L16.2426 9.17157L14.8284 7.75736L12 10.5858Z">
                    </path>
                </svg>
            </button>
        </div>

        <!-- Main Content Section -->
        <div class="content-section">
            <!-- Advanced Correction Toggle Card -->
            <div class="settings-card advanced-toggle-card">
                <label class="trigger-checkbox-item">
                    <input type="checkbox" id="cfg-spell-suggest" checked>
                    <span class="checkbox-label font-bold" id="lbl-advanced-correction">Kiểm tra chính tả nâng cao</span>
                </label>
                <div class="hint-text" id="lbl-advanced-hint">Chống tự động sửa sai từ cá nhân (User Dictionary) khi dứt từ.</div>
            </div>

            <!-- Segmented Tabs -->
            <div class="segmented-tabs">
                <button type="button" class="tab-btn active" id="tab-user-dict">Từ điển cá nhân</button>
                <button type="button" class="tab-btn" id="tab-spell-excl">Ngoại lệ viết tắt</button>
            </div>

            <!-- Description Text -->
            <div class="info-text" id="tab-info-text">
                Từ hoàn chỉnh (vd: soà, alo, in4, tên riêng). So khớp chính xác khi dứt từ (tối đa 1.024 từ).
            </div>

            <!-- Input & Actions Card -->
            <div class="settings-card input-card" id="editor-card">
                <div class="setting-row">
                    <span class="setting-label" id="lbl-word">Từ khóa</span>
                    <div class="input-container">
                        <input type="text" class="setting-input" id="entry-name" placeholder="vd: soà"
                            autocomplete="off">
                    </div>
                </div>
                <div class="field-error-text" id="input-error-msg" style="display: none;"></div>
                <div class="button-row editor-btn-row">
                    <button type="button" class="btn-action btn-primary" id="btn-add">+ Thêm</button>
                    <button type="button" class="btn-action btn-secondary" id="btn-edit" style="display:none;">✎ Sửa</button>
                    <button type="button" class="btn-action btn-danger" id="btn-delete" style="display:none;">- Xóa</button>
                    <button type="button" class="btn-action btn-secondary" id="btn-deselect" style="display:none;">Hủy chọn</button>
                </div>
            </div>

            <!-- List Card -->
            <div class="settings-card list-card" id="list-card-container">
                <div class="list-header">
                    <span class="list-col-name" id="list-header-title">Danh sách từ cá nhân</span>
                    <span class="list-col-counter" id="list-counter">0 từ</span>
                </div>
                <div class="app-list" id="entry-list">
                    <!-- Items inserted by JavaScript -->
                </div>
            </div>

            <!-- Footer Buttons -->
            <div class="button-row footer-row">
                <button type="button" class="btn-action btn-secondary" id="btn-import">Nạp từ file...</button>
                <button type="button" class="btn-action btn-secondary" id="btn-export">Xuất ra file...</button>
            </div>
        </div>

        <!-- Hidden inputs for C++ communication -->
        <input type="hidden" id="val-action" value="">
        <input type="hidden" id="val-target-list" value="0">
        <input type="hidden" id="val-entry-index" value="-1">
        <input type="hidden" id="val-entry-name" value="">
        <input type="hidden" id="val-spell-suggest" value="1">
    </div>
</body>

</html>
